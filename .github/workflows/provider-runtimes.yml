# Checks Blitz's OpenCode requirement against the latest published OpenCode.
#
# Codex and Claude Code run through agent-engines, whose own weekly workflow
# checks the latest Codex and Claude Code CLIs against its pinned protocol and
# version gates. OpenCode runs on Blitz's ACP adapter, so Blitz checks it here:
# each week this installs the newest OpenCode and runs
# `npm run check:runtimes -- --ci`, which fails when OpenCode leaves the
# supported range (see lib/server/providers/runtime-compat.ts). GitHub emails
# the workflow owner when a scheduled run fails.
#
# The runner is not signed in to any provider, so the live Codex model
# catalogue comparison is skipped here. Run `npm run check:runtimes` locally
# to compare it with Blitz's fallback model list.

name: Provider runtimes

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/server/providers/runtime-compat.ts"
      - "lib/server/providers/acp.ts"
      - "scripts/check-provider-runtimes.ts"
      - ".github/workflows/provider-runtimes.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # The --ci check imports only Node built-ins, so the app's dependencies
      # are not installed. OpenCode is installed at its latest version on
      # purpose: the point is to find drift before a local update does. It
      # runs a postinstall script, which npm only runs for packages listed in
      # allow-scripts.
      - name: Install the latest OpenCode
        run: npm install --global --allow-scripts=opencode-ai opencode-ai@latest

      - name: Check provider runtimes
        run: npm run check:runtimes -- --ci
